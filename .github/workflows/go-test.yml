name: Go tests

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "api/**"
      - "core/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/go-test.yml"

jobs:
  test:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        env:
          CGO_ENABLED: "1"
        # go test runs only a subset of vet's checks (not copylocks, for one).
        run: go vet -tags fts5 ./api/... ./core/...
      - name: Run unit tests
        env:
          CGO_ENABLED: "1"
        # fts5: required for catalog_search_fts (go-sqlite3 amalgamation).
        run: go test -tags fts5 ./api/... ./core/...
