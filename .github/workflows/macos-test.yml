name: macOS tests

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "macos/**"
      - "api/**"
      - "core/**"
      - "go.mod"
      - "go.sum"
      - "scripts/build-macos-core.sh"
      - "scripts/check-localizable-xcstrings.py"
      - ".github/workflows/macos-test.yml"

jobs:
  # Independent of Xcode tests — only needs the catalog + Python.
  localizable:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint Localizable.xcstrings
        run: python3 scripts/check-localizable-xcstrings.py

  test:
    if: github.event.pull_request.draft == false
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Show Xcode
        run: xcodebuild -version
      - name: Run unit tests
        env:
          NSUnbufferedIO: "YES"
        run: |
          xcodebuild test \
            -project macos/Provenencia.xcodeproj \
            -scheme Provenencia \
            -destination 'platform=macOS' \
            -only-testing:ProvenenciaTests \
            CODE_SIGNING_ALLOWED=NO
