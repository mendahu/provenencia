                <x-import component-from-global-scope="ProvenenciaDesignSystem_0f6c1f.Icon" name="{{ item.icon }}" size="{{ i15 }}" stroke-weight="light" hint-size="15px,15px"></x-import>

      </div>

<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:800},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;system&quot;,&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;system&quot;,&quot;tsType&quot;:&quot;'system' | 'light' | 'dark'&quot;,&quot;section&quot;:&quot;Appearance&quot;},&quot;collapsed&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Sidebar&quot;},&quot;defaultSection&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;sources&quot;,&quot;source-types&quot;,&quot;source-fields&quot;],&quot;default&quot;:&quot;sources&quot;,&quot;tsType&quot;:&quot;'sources' | 'source-types' | 'source-fields'&quot;,&quot;section&quot;:&quot;Sidebar&quot;},&quot;showAccountTooltip&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Sidebar&quot;},&quot;demoHistory&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Toolbar&quot;},&quot;searchPlaceholder&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Search people, sources, places and files&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Toolbar&quot;},&quot;researcherName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Jake Robins&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Identity&quot;},&quot;researcherRef&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;USR-F4N2P&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Identity&quot;},&quot;projectLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Robins Family&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Identity&quot;},&quot;persist&quot;:{&quot;editor&quot;:null,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
const SECTIONS = [
  { id: 'sources', label: 'Sources', icon: 'library', note: 'Source catalog list and detail arrive in S2-02' },
  { id: 'source-types', label: 'Source types', icon: 'tags', note: 'Type vocabulary editor arrives in S2-04' },
  { id: 'source-fields', label: 'Source fields', icon: 'list', note: 'Field vocabulary editor arrives in S2-04' },
];

const DEMO_TRAIL = [
  { sec: 'sources' },
  { sec: 'sources', item: { label: 'Ilminster parish register, 1841\u20131852', ref: 'SRC-3K9M2' } },
  { sec: 'source-fields' },
  { sec: 'source-fields', item: { label: 'Folio reference', ref: 'FLD-21' } },
  { sec: 'source-types' },
  { sec: 'source-types', item: { label: 'Parish register', ref: 'TYP-07' } },
];

function demoHistory(current) {
  return DEMO_TRAIL.filter((e) => e.sec !== current).concat([{ sec: current }]);
}

class Component extends DCLogic {
  state = { section: null, collapsed: null, systemDark: false, acctHover: false, acctTip: null, history: null, hIndex: null, menu: null };

  componentDidMount() {
    this.onDocDown = (e) => {
      if (this.state.menu && !(this.menuHost && this.menuHost.contains && this.menuHost.contains(e.target))) {
        clearTimeout(this.holdTimer);
        this.held = false;
        this.setState({ menu: null });
      }
    };
    document.addEventListener('mousedown', this.onDocDown, true);
    this.onKey = (e) => {
      if (!(e.metaKey || e.ctrlKey)) return;
      if (e.key === '[') { e.preventDefault(); this.step(-1); }
      if (e.key === ']') { e.preventDefault(); this.step(1); }
    };
    document.addEventListener('keydown', this.onKey);
    this.mq = window.matchMedia('(prefers-color-scheme: dark)');
    this.onMq = () => this.setState({ systemDark: this.mq.matches });
    this.onMq();
    this.mq.addEventListener('change', this.onMq);
    if (this.props.showAccountTooltip) requestAnimationFrame(() => this.measureAcct());
    try {
      if (this.props.persist === false) return;
      const saved = localStorage.getItem('pv.sidebarCollapsed');
      if (saved !== null && this.props.collapsed == null) this.setState({ collapsed: saved === '1' });
    } catch (e) {}
  }

  measureAcct() {
    if (!this.acctEl) return;
    const r = this.acctEl.getBoundingClientRect();
    const t = this.state.acctTip;
    if (!t || Math.round(t.left) !== Math.round(r.right + 8) || Math.round(t.top) !== Math.round(r.top + r.height / 2)) {
      this.setState({ acctTip: { left: r.right + 8, top: r.top + r.height / 2 } });
    }
  }

  componentDidUpdate() {
    if (this.props.showAccountTooltip) this.measureAcct();
  }

  componentWillUnmount() {
    if (this.mq) this.mq.removeEventListener('change', this.onMq);
    document.removeEventListener('mousedown', this.onDocDown, true);
    document.removeEventListener('keydown', this.onKey);
    clearTimeout(this.holdTimer);
  }

  hist() {
    if (this.state.history) return this.state.history;
    if (this.props.demoHistory !== false) return demoHistory(this.props.defaultSection || 'sources');
    return [{ sec: this.props.defaultSection || 'sources' }];
  }

  hIdx() {
    const h = this.hist();
    const i = this.state.hIndex == null ? h.length - 1 : this.state.hIndex;
    return Math.max(0, Math.min(i, h.length - 1));
  }

  startHold(which, e) {
    this.menuHost = e.currentTarget.parentNode;
    this.held = false;
    clearTimeout(this.holdTimer);
    this.holdTimer = setTimeout(() => {
      this.held = true;
      this.setState({ menu: which });
    }, 400);
  }

  openMenu(which, e) {
    e.preventDefault();
    this.menuHost = e.currentTarget.parentNode;
    clearTimeout(this.holdTimer);
    this.held = true;
    this.setState({ menu: which });
  }

  step(delta) {
    clearTimeout(this.holdTimer);
    if (this.held) { this.held = false; return; }
    const h = this.hist();
    const next = this.hIdx() + delta;
    if (next < 0 || next >= h.length) return;
    this.setState({ history: h, hIndex: next, section: h[next].sec, menu: null });
  }

  jump(i) {
    const h = this.hist();
    this.setState({ history: h, hIndex: i, section: h[i].sec, menu: null });
    this.held = false;
  }

  renderVals() {
    const history = this.hist();
    const hIndex = this.hIdx();
    const entry = history[hIndex] || { sec: 'sources' };
    const section = this.state.section || entry.sec || this.props.defaultSection || 'sources';
    const active = SECTIONS.find((s) => s.id === section) || SECTIONS[0];
    const collapsed = this.state.collapsed ?? this.props.collapsed ?? false;
    const counts = { sources: 1904, 'source-types': 12, 'source-fields': 46 };
    const pref = this.props.theme ?? 'system';
    const name = this.props.researcherName ?? 'Jake Robins';
    const ref = this.props.researcherRef ?? 'USR-F4N2P';
    const secOf = (id) => SECTIONS.find((s) => s.id === id) || SECTIONS[0];
    const rowOf = (e, i) => {
      const sec = secOf(e.sec);
      return {
        icon: sec.icon,
        root: e.item ? sec.label : '',
        sep: e.item ? '\u203a' : '',
        leaf: e.item ? e.item.label : sec.label,
        leafWeight: e.item ? 'var(--weight-semibold)' : 'var(--weight-semibold)',
        ref: e.item ? e.item.ref : '',
        onSelect: () => this.jump(i),
      };
    };
    return {
      theme: pref === 'system' ? (this.state.systemDark ? 'dark' : 'light') : pref,
      section,
      collapsed,
      expanded: !collapsed,
      isAligned: true,
      headerHeight: '46px',
      railWidth: collapsed ? '78px' : '264px',
      pageTitle: active.label,
      placeholderTitle: active.label + ' content goes here',
      placeholderNote: active.note,
      crumbs: entry.item ? [{ label: active.label }, { label: entry.item.ref }] : [{ label: active.label }],
      i15: 15,
      searchProps: this.searchProps || (this.searchProps = { style: { flex: 1, minWidth: 0 } }),
      crumbProps: this.crumbProps || (this.crumbProps = { style: { flexWrap: 'nowrap', minWidth: 0, overflow: 'hidden' } }),
      searchPlaceholder: this.props.searchPlaceholder ?? 'Search people, sources, places and files',
      backDisabled: hIndex <= 0,
      forwardDisabled: hIndex >= history.length - 1,
      backMenuOpen: this.state.menu === 'back',
      forwardMenuOpen: this.state.menu === 'forward',
      backItems: history.slice(0, hIndex).map(rowOf).reverse(),
      forwardItems: history.slice(hIndex + 1).map((e, i) => rowOf(e, hIndex + 1 + i)),
      goBack: () => this.step(-1),
      goForward: () => this.step(1),
      holdBack: (e) => this.startHold('back', e),
      holdForward: (e) => this.startHold('forward', e),
      releaseHold: () => clearTimeout(this.holdTimer),
      openBackMenu: (e) => this.openMenu('back', e),
      openForwardMenu: (e) => this.openMenu('forward', e),
      projectLabel: this.props.projectLabel ?? 'Robins Family',
      researcherName: name,
      researcherRef: ref,
      accountLabel: name + ' · ' + ref,
      acctTipOpacity: (this.props.showAccountTooltip ?? false) || this.state.acctHover ? 1 : 0,
      acctRef: (el) => { this.acctEl = el; },
      acctTipLeft: (this.state.acctTip ? this.state.acctTip.left : 0) + 'px',
      acctTipTop: (this.state.acctTip ? this.state.acctTip.top : 0) + 'px',
      showAcct: () => {
        const r = this.acctEl && this.acctEl.getBoundingClientRect();
        this.setState({ acctHover: true, acctTip: r ? { left: r.right + 8, top: r.top + r.height / 2 } : null });
      },
      hideAcct: () => this.setState({ acctHover: false }),
      navGroups: [{
        label: 'Source layer',
        items: SECTIONS.map((s) => ({ ...s, count: counts[s.id] })),
      }],
      setSection: (id) => this.setState((st) => {
        const h = this.hist();
        const i = this.hIdx();
        if (h[i] && h[i].sec === id && !h[i].item) return { section: id, menu: null };
        const next = h.slice(0, i + 1).concat([{ sec: id }]).slice(-12);
        return { section: id, history: next, hIndex: next.length - 1, menu: null };
      }),
      toggleRail: () => this.setState((st) => {
        const next = !(st.collapsed ?? this.props.collapsed ?? false);
        if (this.props.persist !== false) {
          try { localStorage.setItem('pv.sidebarCollapsed', next ? '1' : '0'); } catch (e) {}
        }
        return { collapsed: next };
      }),
    };
  }
}

</script>
</body>
