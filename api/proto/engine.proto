syntax = "proto3";

package provenencia.engine.v1;

option go_package = "github.com/mendahu/provenencia/api/proto/engine";

// Method identifies the FFI operation. The C ABI is one call that takes this
// discriminant plus a protobuf payload; it is not a per-field getter surface.
enum Method {
  METHOD_UNSPECIFIED = 0;
  METHOD_PING = 1;
  METHOD_GET_VERSION = 2;
  METHOD_GET_INSTALL_IDENTITY = 3;
  METHOD_COMPLETE_ONBOARDING = 4;
  METHOD_REMOVE_INSTALL_IDENTITY = 5;
  METHOD_GET_ACTIVE_PROJECT = 6;
  METHOD_OPEN_PROJECT = 7;
  METHOD_REMOVE_ACTIVE_PROJECT = 8;
  METHOD_LIST_PROJECT_USERS = 9;
  METHOD_SIGN_OUT = 10;
  METHOD_GET_PROJECT_INFO = 11;
  METHOD_LIST_SOURCES = 12;
  METHOD_GET_SOURCE_WORKSPACE = 13;
  METHOD_CREATE_SOURCE = 14;
  METHOD_UPDATE_SOURCE = 15;
  METHOD_ADD_SOURCE_NOTE = 16;
  METHOD_UPDATE_SOURCE_NOTE = 17;
  METHOD_DELETE_SOURCE_NOTE = 18;
  METHOD_SET_SOURCE_METADATA = 19;
  METHOD_CLEAR_SOURCE_METADATA = 20;
  METHOD_CREATE_ARTIFACT = 21;
  METHOD_INGEST_ARTIFACT_FILE = 22;
  METHOD_LIST_SOURCE_TYPES = 23;
  METHOD_CREATE_SOURCE_TYPE = 24;
  METHOD_LIST_METADATA_FIELDS = 25;
  METHOD_CREATE_METADATA_FIELD = 26;
  reserved 27;
  reserved "METHOD_COUNT_FILES";
  reserved 71;
  reserved "METHOD_UPDATE_CITATION_WITH_OBSERVATIONS";
  // Per-entity headers ride GetConclusionDetail.
  reserved 92, 94, 95;
  reserved "METHOD_GET_EVENT_HEADER", "METHOD_GET_PLACE_HEADER", "METHOD_GET_PERSON_HEADER";
  METHOD_UPDATE_METADATA_FIELD = 28;
  METHOD_DELETE_SOURCE_TYPE = 29;
  METHOD_DELETE_METADATA_FIELD = 30;
  METHOD_UPDATE_SOURCE_TYPE = 31;
  METHOD_LIST_TYPE_SUGGESTIONS = 32;
  METHOD_ASSIGN_TYPE_FIELD = 33;
  METHOD_REMOVE_TYPE_FIELD = 34;
  METHOD_GET_WORKSPACE_NAV_COUNTS = 35;
  METHOD_UPDATE_ARTIFACT = 36;
  METHOD_LIST_SOURCE_CREDIBILITY_GRADES = 37;
  METHOD_UPSERT_SOURCE_CREDIBILITY_ASSESSMENT = 38;
  METHOD_DISMISS_SOURCE_METADATA_SUGGESTION = 39;
  METHOD_REORDER_SOURCE_METADATA = 40;
  METHOD_ENSURE_FILE_THUMBNAIL = 41;
  METHOD_CLOSE_CATALOG_SESSION = 42;
  METHOD_SET_SOURCE_COVER = 43;
  METHOD_SEARCH_CATALOG = 44;
  METHOD_LIST_SUBJECT_TYPES = 45;
  METHOD_CREATE_SUBJECT = 46;
  METHOD_UPDATE_SUBJECT = 47;
  METHOD_DELETE_SUBJECT = 48;
  METHOD_LIST_SUBJECTS = 49;
  METHOD_SET_SUBJECT_POSITION = 50;
  METHOD_CLEAR_SUBJECT_POSITION = 51;
  METHOD_LIST_SUBJECT_POSITIONS = 52;
  METHOD_LIST_PROPERTIES = 53;
  METHOD_CREATE_PROPERTY = 54;
  METHOD_UPDATE_PROPERTY = 55;
  METHOD_DELETE_PROPERTY = 56;
  METHOD_LIST_SUBJECT_TYPE_PROPERTIES = 57;
  METHOD_ASSIGN_SUBJECT_TYPE_PROPERTY = 58;
  METHOD_REMOVE_SUBJECT_TYPE_PROPERTY = 59;
  METHOD_LIST_PLACEABLE_SUBJECT_TYPES = 60;
  METHOD_GET_SUBJECT_TYPE_PRESENTATION = 61;
  METHOD_LIST_CONNECT_RULES = 62;
  METHOD_LIST_PROPERTY_TERMS = 63;
  METHOD_CREATE_PROPERTY_TERM = 64;
  METHOD_UPDATE_PROPERTY_TERM = 65;
  METHOD_DELETE_PROPERTY_TERM = 66;
  METHOD_CREATE_CITATION_WITH_OBSERVATIONS = 67;
  METHOD_ADD_OBSERVATIONS_TO_CITATION = 68;
  METHOD_LIST_OBSERVATIONS_BY_SOURCE = 69;
  METHOD_GET_CITATION = 70;
  METHOD_CREATE_CITED_BRIDGE = 72;
  METHOD_CITATION_COUNTS_BY_SOURCE = 73;
  METHOD_LIST_CITATIONS_BY_ARTIFACT = 74;
  METHOD_UPDATE_CITATION = 75;
  METHOD_UPDATE_OBSERVATION = 76;
  METHOD_DELETE_OBSERVATION = 77;
  METHOD_GET_PROPERTIES_WORKSPACE = 78;
  METHOD_LIST_SOURCE_GRAPH_PROGRESS = 79;
  METHOD_GET_SOURCE_GRAPH_PROGRESS = 80;
  METHOD_GET_DELETE_IMPACT = 81;
  METHOD_DELETE_SOURCE = 82;
  METHOD_DELETE_ARTIFACT = 83;
  METHOD_DELETE_CITATION = 84;
  METHOD_PROMOTE_SUBJECT = 85;
  METHOD_LIST_SUBJECT_MEMBERSHIPS = 86;
  METHOD_LIST_PERSON_HEADERS = 87;
  METHOD_LIST_PROMOTE_TARGET_SUGGESTIONS = 88;
  METHOD_LIST_CLAIM_CONFIDENCE_GRADES = 89;
  METHOD_GET_CONCLUSION_DETAIL = 90;
  METHOD_LIST_EVENT_HEADERS = 91;
  METHOD_LIST_PLACE_HEADERS = 93;
  METHOD_LIST_SOURCE_EVENT_TITLES = 96;
  METHOD_PROPOSE_PROMOTE_GRAPH_ALIGNMENT = 97;
  METHOD_APPLY_PROMOTE_GRAPH_ALIGNMENT = 98;
}

