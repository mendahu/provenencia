syntax = "proto3";

package provenance.engine.v1;

option go_package = "github.com/mendahu/provenance/api/proto/engine";

// Method identifies the FFI operation. The C ABI is one call that takes this
// discriminant plus a protobuf payload; it is not a per-field getter surface.
enum Method {
  METHOD_UNSPECIFIED = 0;
  METHOD_PING = 1;
  METHOD_GET_VERSION = 2;
  // TEMPORARY (Spike 1 PR3): dylib packaging probe. Remove when PR4 create/open exists.
  METHOD_SQLITE_PROBE = 3;
}

message PingRequest {
  string message = 1;
}

message PingResponse {
  string message = 1;
}

message GetVersionRequest {}

message GetVersionResponse {
  string version = 1;
}

// TEMPORARY (Spike 1 PR3): empty request for the dylib SQLite probe. Remove with METHOD_SQLITE_PROBE.
message SqliteProbeRequest {}

// TEMPORARY (Spike 1 PR3): probe result. Remove with METHOD_SQLITE_PROBE.
message SqliteProbeResponse {
  bool ok = 1;
  string detail = 2;
}
