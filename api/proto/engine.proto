// --- Source catalog (S2-13) ---

message Source {
  string id = 1;
  string ref = 2;
  string source_type_id = 3;
  string title = 4;
  string description = 5;
  // Thumbnail JPEG under objects/… for list cells (empty = no raster cover).
  string thumbnail_rel_path = 6;
  // Reserved / unused for Source cover. File-type glyphs stay on Artifact
  // rows only; Source paints type icon or raster.
  string thumbnail_media_type = 7;
  string thumbnail_original_filename = 8;
  // Cover preference: "artifact" (primary_artifact_id) or "type_icon".
  string cover_mode = 9;
  // Set when cover_mode is artifact; empty for type_icon.
  string primary_artifact_id = 10;
  // True when this Source has at least one Artifact row (fileless counts).
  // Used by Sources list Evidence graph gate — not cover presence.
  bool has_artifact = 11;
  // Max audit_transactions.revision scoped to this Source (audit_transaction_scopes):
  // its row and any work under it. Sources list "Updated" sort.
  int64 updated_revision = 12;
}

message SourceNote {
  string id = 1;
  string source_id = 2;
  string body = 3;
  // Create attribution from audit (not domain columns on source_notes).
  string author_display_name = 4;
  string created_at = 5; // RFC3339 UTC
}

message SourceFileRef {
  string id = 1;
  string rel_path = 2;
  string original_filename = 3;
  string media_type = 4;
  int64 byte_size = 5;
}

message Artifact {
  string id = 1;
  string ref = 2;
  string source_id = 3;
  string file_id = 4; // empty when fileless
  string description = 5;
  SourceFileRef file = 6; // set when file_id present
  string label = 7; // required list headline
  // Thumbnail JPEG under objects/… (empty when fileless / non-image / skipped).
  string thumbnail_rel_path = 8;
}

// SourceCredibilityGrade is one source_credibility_grades vocabulary row.
message SourceCredibilityGrade {
  string id = 1;
  string key = 2;
  string origin = 3;
  string label = 4;
  int32 sort_order = 5;
}

// SourceCredibilityAssessment is the working Interpretation assessment for a Source.
message SourceCredibilityAssessment {
  string id = 1;
  string source_id = 2;
  string grade_id = 3;
  string grade_key = 4;
  string grade_label = 5;
  string argument = 6;
}

message SourceType {
  string id = 1;
  string key = 2;
  string origin = 3;
  string label = 4;
  string description = 5;
  // How many sources classify as this type. Deleting is only allowed at 0
  // (see sourcetypes.ErrInUse); the client uses the count to disable its
  // delete affordance and say what is holding the type.
  int32 used_by = 6;
  // How many metadata fields this type suggests — the list's third column,
  // so browsing does not have to fetch every type's join rows.
  int32 suggested_field_count = 7;
  // Closed design-system type_* key for evidence representation.
  string icon_key = 8;
}

// TypeSuggestion is one source_type_metadata_fields join row: a field this
// type suggests, in its stored order. Suggestions are not a schema — a
// source of the type may leave any of them blank.
message TypeSuggestion {
  MetadataField field = 1;
  int32 sort_order = 2;
}

message MetadataField {
  string id = 1;
  string key = 2;
  string origin = 3;
  string label = 4;
  string data_type = 5; // text | url
  string description = 6;
  // How many source_metadata rows reference this field. Deleting is only
  // allowed at 0 (see metadatafields.ErrInUse); the client uses the count to
  // disable its delete affordance and say what is holding the field.
  int32 used_by = 7;
}

message MetadataWorkspaceEntry {
  MetadataField field = 1;
  string value_text = 2;
  reserved 3, 8;
  reserved "date_value_id", "date";
  bool has_value = 4;
  bool suggested = 5;
  int32 sort_order = 6;
  reserved 7;
  reserved "date_summary";
}

// DateValueInput maps to datevalues.Insert (kind point|range; see docs/structured-date-model.md).
message DateValueInput {
  string kind = 1;
  string qualifier = 2;
  string calendar = 3;
  optional int32 start_year = 4;
  optional int32 start_month = 5;
  optional int32 start_day = 6;
  optional int32 start_hour = 7;
  optional int32 start_minute = 8;
  optional int32 start_second = 9;
  optional int32 start_millisecond = 10;
  string start_tz = 11;
  optional int32 end_year = 12;
  optional int32 end_month = 13;
  optional int32 end_day = 14;
  optional int32 end_hour = 15;
  optional int32 end_minute = 16;
  optional int32 end_second = 17;
  optional int32 end_millisecond = 18;
  string end_tz = 19;
  string phrase = 20;
}

message ListSourcesRequest {
  string project_dir = 1;
}

message ListSourcesResponse {
  repeated Source sources = 1;
}

message GetSourceWorkspaceRequest {
  string project_dir = 1;
  string source_id = 2;
}

message GetSourceWorkspaceResponse {
  Source source = 1;
  repeated SourceNote notes = 2;
  repeated MetadataWorkspaceEntry metadata = 3;
  repeated Artifact artifacts = 4;
  // Omitted when no assessment row (UI may display Standard without a row).
  SourceCredibilityAssessment credibility = 5;
  // 6, 7, 8 held the source type, credibility grade, and metadata field
  // vocabulary. The page now reads each from its own list RPC so one cache
  // owns each list; duplicating them here staled every open page on a
  // vocabulary edit made elsewhere.
  reserved 6, 7, 8;
}

