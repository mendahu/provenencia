// AssignTypeField attaches an existing metadata field to a type at the end
// of its order. Assigning a field the type already suggests is a no-op, not
// an error. Both replies carry the type's whole suggestion list back so the
// client never has to re-derive sort_order.
message AssignTypeFieldRequest {
  string project_dir = 1;
  string user_id = 2;
  string type_id = 3;
  string field_id = 4;
}

message AssignTypeFieldResponse {
  repeated TypeSuggestion suggestions = 1;
}

// RemoveTypeField detaches a field from a type. It deletes only the join —
// the field stays in the vocabulary and sources already carrying a value
// for it keep that value.
message RemoveTypeFieldRequest {
  string project_dir = 1;
  string user_id = 2;
  string type_id = 3;
  string field_id = 4;
}

message RemoveTypeFieldResponse {
  repeated TypeSuggestion suggestions = 1;
}

message DeleteSourceTypeRequest {
  string project_dir = 1;
  string user_id = 2;
  string type_id = 3;
}

message DeleteSourceTypeResponse {}

message DeleteMetadataFieldRequest {
  string project_dir = 1;
  string user_id = 2;
  string field_id = 3;
}

message DeleteMetadataFieldResponse {}

// VocabularyOriginCounts is the sidebar / vocabulary-header split for a
// catalog vocabulary (source_types or source_metadata_fields). total is
// always seeded + user + plugin.
message VocabularyOriginCounts {
  int32 total = 1;
  int32 seeded = 2;
  int32 user = 3;
  int32 plugin = 4;
}

// GetWorkspaceNavCounts opens the project catalog once and returns COUNT(*)
// badges for every workspace sidebar destination, including origin splits
// for vocabulary rows. Prefer this over N serial list/count RPCs on appear.
message GetWorkspaceNavCountsRequest {
  string project_dir = 1;
}

message GetWorkspaceNavCountsResponse {
  int32 sources = 1;
  VocabularyOriginCounts source_types = 2;
  VocabularyOriginCounts metadata_fields = 3;
  reserved 4;
  reserved "files";
  int32 persons = 5; // unmerged Person handles
  int32 events = 6;  // unmerged Event handles
  int32 places = 7;  // unmerged Place handles
}

// EnsureFileThumbnail lazily creates (or returns) the default thumbnail
// derivative for a File that is the primary File of some Artifact.
message EnsureFileThumbnailRequest {
  string project_dir = 1;
  string file_id = 2;
}

message EnsureFileThumbnailResponse {
  string rel_path = 1; // objects/… path; empty when skipped
  bool skipped = 2;    // non-image, unprocessable, or no derivative
}

message CloseCatalogSessionRequest {
  string project_dir = 1; // required; releases the held session for this project
}

message CloseCatalogSessionResponse {}

// WorkspaceLocation is the navigable place payload shared by search hits and
// (later) omnibar go(to:). Aligns with macOS WorkspaceLocation / WorkspaceSection.
message WorkspaceLocation {
  string section = 1;    // sources | source-types | metadata | properties | persons
  string source_id = 2;
  string field_id = 3;
  string type_id = 4;
  string ref = 5;        // denormalized jump-menu cache
  string title = 6;      // denormalized jump-menu cache
  string subject_id = 7;
  string citation_id = 8;
  string artifact_id = 9;
  string observation_id = 10;
  string source_surface = 11; // page | graph | citationComposer
  string connect_from_subject_id = 12;
  string connect_to_subject_id = 13;
  string connect_bridge_type_key = 14;
  string source_title = 15;
  string subject_type_key = 16; // Properties type-strip category; empty = All properties
  string property_id = 17;      // Properties inspector row
  string entity_id = 18;        // Conclusion handle (persons / events / places)
}

// SearchCatalog finds navigable catalog roots for the omnibar (S3-07+).
message SearchCatalogRequest {
  string project_dir = 1;
  string query = 2;
  WorkspaceLocation location = 3; // current place; at least section for context boosts
  // Restrict hits to these kinds. Empty = the omnibar's default set, which
  // excludes person / event / place until S9-35.
  repeated string kinds = 4;
}

message SearchHit {
  string kind = 1;         // source | source_type | metadata_field | person | event | place
  string id = 2;
  string ref = 3;
  string title = 4;
  string subtitle = 5;
  // Stable match field code (title|ref|label|key|notes|metadata|filename|description|fuzzy).
  // Not user-facing copy — Mac localizes via L10n.
  string match_reason = 6;
  WorkspaceLocation location = 7;
  // Display stubs for omnibar lead chrome (avoid a second full-list fetch).
  string thumbnail_rel_path = 8; // Source cover raster when already derived; else empty
  string icon_key = 9;           // Source type icon, or type hit icon; empty for fields
  // Optional raw snippet for body/rollup matches (notes/metadata/filename). No English prefix.
  string match_snippet = 10;
  int32 member_count = 11; // accepted members, for person / event / place hits
}

message SearchCatalogResponse {
  repeated SearchHit hits = 1;
}

// SubjectType is one subject_types vocabulary row (shared with Conclusion).
message SubjectType {
  string id = 1;
  string key = 2;
  string origin = 3;
  string label = 4;
  string description = 5;
  string ref_prefix = 6;
  string candidate_ref_prefix = 7;
}

// Subject is one Interpretation subject (candidate) row.
message Subject {
  string id = 1;
  string ref = 2;
  string source_id = 3;
  string subject_type_id = 4;
  string label = 5;
  string description = 6;
}

// SubjectPosition is unaudited graph layout for one subject.
message SubjectPosition {
  string subject_id = 1;
  int64 grid_x = 2;
  int64 grid_y = 3;
}

message ListSubjectTypesRequest {
  string project_dir = 1;
}

message ListSubjectTypesResponse {
  repeated SubjectType types = 1;
}

message CreateSubjectRequest {
  string project_dir = 1;
  string user_id = 2;
  string source_id = 3;
  string subject_type_id = 4;
  string label = 5;
  string description = 6;
  bool has_placement = 7;
  int64 grid_x = 8;
  int64 grid_y = 9;
}

message CreateSubjectResponse {
  Subject subject = 1;
}

message UpdateSubjectRequest {
  string project_dir = 1;
  string user_id = 2;
  string subject_id = 3;
  string label = 4;
  string description = 5;
}

message UpdateSubjectResponse {
  Subject subject = 1;
}

message DeleteSubjectRequest {
  string project_dir = 1;
  string user_id = 2;
  string subject_id = 3;
}

message DeleteSubjectResponse {}

// CanonicalEntity is a Conclusion handle (PER-…, EVT-…, PLC-…).
message CanonicalEntity {
  string id = 1;
  string ref = 2;
  string subject_type_id = 3;
  string label = 4;
}

// IdentityClaim files one Subject onto one handle; accepted claims are members.
message IdentityClaim {
  string id = 1;
  string subject_id = 2;
  string entity_id = 3;
  string status = 4; // provisional | accepted | rejected
  string confidence_grade_id = 5; // empty = no grade
  string argument = 6;
}

// ClaimConfidenceGrade is one claim_confidence_grades vocabulary row: the
// confidence scale on Identity Claims (not Source credibility).
message ClaimConfidenceGrade {
  string id = 1;
  string key = 2;
  string origin = 3;
  string label = 4;
  int32 sort_order = 5;
}

message ListClaimConfidenceGradesRequest {
  string project_dir = 1;
}

message ListClaimConfidenceGradesResponse {
  repeated ClaimConfidenceGrade grades = 1;
}

// PromoteSubject files an accepted claim for the Subject, one transaction:
// onto a newly minted handle of its type when entity_id is empty, else onto
// that existing handle (same type, unmerged; claim only). Refuses members and
// non-primary kinds.
message PromoteSubjectRequest {
  string project_dir = 1;
  string user_id = 2;
  string subject_id = 3;
  string entity_id = 4; // empty = mint a new handle
  string confidence_grade_id = 5; // empty = no grade
  string argument = 6;
}

message PromoteSubjectResponse {
  CanonicalEntity entity = 1;
  IdentityClaim claim = 2;
}

// SubjectMembership is a view of one Subject's accepted Identity Claim: the
// claim id and the handle it files the Subject onto. kind is the handle's
// subject type key (person, event, place, …). Not provisional / rejected claims.
message SubjectMembership {
  string subject_id = 1;
  CanonicalEntity entity = 2;
  string kind = 3;
  string claim_id = 4;
  NameValueInput name = 5; // handle's displayed auto-reconciled name; absent when none
}

// EventTitleRule is one row of the Event naming matrix (Spike 9 R4), in
// precedence order. Go chooses the rule; the app fills its L10n template.
enum EventTitleRule {
  EVENT_TITLE_RULE_UNSPECIFIED = 0;
  EVENT_TITLE_RULE_RECORDED_NAME = 1; // event_name
  EVENT_TITLE_RULE_SUBJECT = 2;       // {Type} of {subject}
  EVENT_TITLE_RULE_COUPLE = 3;        // Marriage of {a} and {b}
  EVENT_TITLE_RULE_SUBJECTS = 4;      // {Type} of {first} et al.
  EVENT_TITLE_RULE_LABEL = 5;         // working label
  EVENT_TITLE_RULE_TYPE_AT_PLACE = 6; // {Type} at {place}
  EVENT_TITLE_RULE_TYPE = 7;          // Unspecified {type}
  EVENT_TITLE_RULE_REF = 8;
}

// EventTitleSubject is one subject-role person; no name reads "unnamed person".
message EventTitleSubject {
  NameValueInput name = 1;
}

// EventTitle is the chosen rule and the trimmed parts it reads.
message EventTitle {
  EventTitleRule rule = 1;
  string recorded_name = 2;
  string label = 3;
  string ref = 4;
  string type_key = 5;
  string type_label = 6;
  repeated EventTitleSubject subjects = 7;
  string place = 8;
}

// ListSourceEventTitles titles every Event Subject on one Source's Evidence
// graph from what that Source cites, by the same rule as Event headers.
message ListSourceEventTitlesRequest {
  string project_dir = 1;
  string source_id = 2;
}

message SourceEventTitle {
  string subject_id = 1;
  EventTitle title = 2;
}

message ListSourceEventTitlesResponse {
  repeated SourceEventTitle titles = 1;
}

// ListSubjectMemberships returns the handle of every promoted Subject on one
// Source's Evidence graph. Unpromoted Subjects are absent.
message ListSubjectMembershipsRequest {
  string project_dir = 1;
  string source_id = 2;
}

message ListSubjectMembershipsResponse {
  repeated SubjectMembership memberships = 1;
}

// HeaderPlace is one Place a walk reached. names are kept toponyms in rank
// order. parents is the hierarchical chain at the walk's date (nearest first).
message HeaderPlace {
  repeated string names = 1;
  reserved 2;
  reserved "name_count"; // always len(names)
  // entity is the Place; its page owns the names' Why.
  CanonicalEntity entity = 3;
  // parents is the hierarchical chain at the walk's date (nearest first).
  // parents_are_candidates is true when several parents hold at once.
  repeated string parents = 4;
  bool parents_are_candidates = 5;
}

// LifeFacts is a birth or a death: the event's date, else its start date,
// and every linked Place's kept names.
message LifeFacts {
  DateValueInput date = 1;
  int32 date_count = 2;
  repeated HeaderPlace places = 3;
  // event is the birth or death event read; absent when none is linked.
  CanonicalEntity event = 4;
  // event_count is how many birth (or death) events survive; > 1 is a
  // disagreement, and event is the earliest dated one.
  int32 event_count = 5;
}

// EventSubject is one person on an event through a subject-role participation.
message EventSubject {
  CanonicalEntity entity = 1;
  NameValueInput name = 2;
  int32 name_value_count = 3;
}

// PersonHeader is one Person as a row, composed from the auto-reconciler's
// cache. Structures only: the app formats the title (name, else entity
// label, else ref). name is the displayed auto-reconciled name, absent when
// no member names the Person; name_value_count counts displayed name values
// (names are one structure, so at most 1; > 1 would read as mixed, and the
// extra values are the list's +N). birth and death are read off the
// canonical graph.
message PersonHeader {
  CanonicalEntity entity = 1;
  NameValueInput name = 2;
  int32 name_value_count = 3;
  LifeFacts birth = 4;
  LifeFacts death = 5;
}

// ListPersonHeaders returns every unmerged Person in list order: by the title
// the row shows (auto-reconciled name, else label), ignoring case and
// diacritics, then ref-only rows by ref. The app shows rows as given.
message ListPersonHeadersRequest {
  string project_dir = 1;
}

message ListPersonHeadersResponse {
  repeated PersonHeader headers = 1;
}

// EventHeader is one Event as a row, composed from the auto-reconciler's
// cache. Structures only: the app formats the title. event_name is the
// rank-1 recorded name, empty when none. date is the rank-1 date when one
// exists; otherwise start_date and end_date are the span. Counts are kept
// values of that Property (the list's +N). subjects and places come from
// the canonical graph.
message EventHeader {
  CanonicalEntity entity = 1;
  string event_name = 2;
  int32 event_name_count = 3;
  ConclusionTerm event_type = 4;
  int32 event_type_count = 5;
  DateValueInput date = 6;
  int32 date_count = 7;
  DateValueInput start_date = 8;
  int32 start_date_count = 9;
  DateValueInput end_date = 10;
  int32 end_date_count = 11;
  // subjects are subject-role persons, participation ref then person ref.
  // places are every location's kept names with hierarchical parents at the
  // event's date (Locations that share part_of fold into one chain).
  repeated EventSubject subjects = 12;
  repeated HeaderPlace places = 13;
  // title is the naming-matrix rule Go chose and the parts it reads.
  EventTitle title = 14;
}

// ListEventHeaders returns every unmerged Event in list order: dated
// events by the date window, else the start date, then the rest by ref.
message ListEventHeadersRequest {
  string project_dir = 1;
}

message ListEventHeadersResponse {
  repeated EventHeader headers = 1;
}

// PlaceRelationship is one related Place on a Place detail (S9-40).
// kind is part_of, contains, predecessor, or successor. start_date /
// end_date are the membership span (part_of / contains) or the other
// place's period (succession).
message PlaceRelationship {
  CanonicalEntity entity = 1;
  string title = 2;
  string kind = 3;
  DateValueInput start_date = 4;
  DateValueInput end_date = 5;
}

// PlaceHeader is one Place as a row, composed from the auto-reconciler's
// cache. names are the kept toponyms in rank order (Montréal and Montreal
// are both names). start_date / end_date are the Place's period; parents is
// today's hierarchical chain (or the last chain when the period has ended).
// parents_are_candidates is true when several parents hold at once.
// Relationship lists are filled on GetConclusionDetail only. kind stays
// empty (place_nature deferred).
message PlaceHeader {
  CanonicalEntity entity = 1;
  repeated string names = 2;
  DateValueInput start_date = 3;
  DateValueInput end_date = 4;
  string kind = 5;
  repeated string parents = 6;
  bool parents_are_candidates = 7;
  repeated PlaceRelationship part_of = 8;
  repeated PlaceRelationship contains = 9;
  repeated PlaceRelationship predecessors = 10;
  repeated PlaceRelationship successors = 11;
}

// ListPlaceHeaders returns every unmerged Place in list order: by the title
// the row shows (first kept toponym, else label), ignoring case and
// diacritics, then ref-only rows by ref. The app shows rows as given.
message ListPlaceHeadersRequest {
  string project_dir = 1;
}

message ListPlaceHeadersResponse {
  repeated PlaceHeader headers = 1;
}

// ConclusionValue is one Property value; exactly the field for the
// Property's value type is set.
message ConclusionValue {
  oneof kind {
    string text = 1;
    int64 integer = 2;
    ConclusionTerm term = 3;
    DateValueInput date = 4;
    NameValueInput name = 5;
  }
}

message ConclusionTerm {
  string id = 1;
  string key = 2;
  string label = 3;
}

// ReconciledValueDetail is one auto-reconciled value of a Property: displayed
// (reason "kept") or not, and why.
message ReconciledValueDetail {
  int32 rank = 1;
  string reason = 2;
  int32 support = 3; // distinct Sources
  int32 against = 4; // negative records that match it
  ConclusionValue value = 5;
}

// ReconcilerOutcomeDetail is what the auto-reconciler did with one
// Observation, with the record's own value and the evidence it weighed.
message ReconcilerOutcomeDetail {
  string observation_id = 1;
  string observation_ref = 2;
  string reason = 3;      // kept, folded, outvoted, weak, denied, provisional, no_evidence, against
  int32 value_rank = 4;   // the value it went into; 0 for none
  string denied_by_observation_id = 5;
  ConclusionValue recorded = 6;
  string subject_id = 7;
  string subject_ref = 8;
  string citation_id = 9;
  string source_id = 10;
  string source_title = 11;
  string credibility_key = 12;       // "" = no assessment (standard)
  bool transcription_uncertain = 13;
  string claim_confidence_key = 14;  // "" = no grade (moderate)
  // Grade sort_order minus the default grade's (standard, moderate), as the
  // auto-reconciler weighed it: below 0 is weak evidence.
  int32 credibility_offset = 15;
  int32 claim_confidence_offset = 16;
  string artifact_id = 17;
  // For "outvoted": the winning value's Sources of every Source that voted
  // on that unit (for a name, the part it lost on). 0 otherwise.
  int32 vote_support = 18;
  int32 vote_total = 19;
}

// ConclusionField is one Property of a handle: its state (single, merged,
// mixed, or "" for empty), every auto-reconciled value, and every outcome.
message ConclusionField {
  string property_id = 1;
  string property_key = 2;
  string label = 3;
  string value_type = 4;
  string state = 5;
  repeated ReconciledValueDetail values = 6;
  repeated ReconcilerOutcomeDetail outcomes = 7;
}

// GetConclusionDetail composes one handle's detail from the auto-reconciler
// cache (S9-15). Any kind; unknown or merged handles are
// conclusiondetails.not_found.
message GetConclusionDetailRequest {
  string project_dir = 1;
  string entity_id = 2;
}

message ConclusionDetail {
  CanonicalEntity entity = 1;
  repeated ConclusionField fields = 2;
  int32 member_count = 3; // accepted members
  // header is the handle's row for its kind, read with the detail so a page
  // has one load, one error, and one consistent read. Absent for a kind
  // with no header composer.
  oneof header {
    PersonHeader person = 4;
    EventHeader event = 5;
    PlaceHeader place = 6;
  }
}

// ListPromoteTargetSuggestions returns existing handles a Subject could join,
// best first: same type, unmerged, not its own handle, scored by the type's
// match profile (core/match). limit 0 = the engine default.
message ListPromoteTargetSuggestionsRequest {
  string project_dir = 1;
  string subject_id = 2;
  int32 limit = 3;
}

// MatchReason is one Property's part in a match score: its best similarity
// (0…1) and the points it added (negative for a clear disagreement).
message MatchReason {
  string property_key = 1;
  string property_origin = 2;
  double similarity = 3;
  double contribution = 4;
}

// PromoteTargetSuggestion is one handle the Subject could join. person is
// the row header for Person handles; Events and Places carry the handle
// alone until their header composers land.
message PromoteTargetSuggestion {
  CanonicalEntity entity = 1;
  double score = 2;
  repeated MatchReason reasons = 3;
  PersonHeader person = 4;
  int32 member_count = 5; // accepted members of the handle
}

message ListPromoteTargetSuggestionsResponse {
  repeated PromoteTargetSuggestion suggestions = 1;
}

// ProposePromoteGraphAlignment loads one Source's Evidence layer and proposes
// a handle, New, or Skip for every primary Subject (S9-42). fixed are decided
// or already-chosen anchors; already-promoted Subjects are free anchors too.
message ProposePromoteGraphAlignmentRequest {
  string project_dir = 1;
  string source_id = 2;
  repeated PromoteGraphAlignmentFixed fixed = 3;
}

// A decided row Align holds as given. target is handle (handle_id set), new,
// or skip; empty means handle. A New or Skip row stays off every handle.
message PromoteGraphAlignmentFixed {
  string subject_id = 1;
  string handle_id = 2;
  string target = 3;
}

message PromoteGraphAlignmentComparison {
  string property_key = 1;
  string property_origin = 2;
  string outcome = 3; // agree, conflict, unknown
  string value_type = 4;
  bool pinned = 5;
  double weight = 6;
  // Empty for the Subject's own records; a neighbor label for a one-hop record.
  string group_label = 7;
  string incoming_observation_id = 8;
  string incoming_display = 9;
  string incoming_source = 10;
  string member_observation_id = 11;
  string member_display = 12;
  string member_source = 13;
}

message PromoteGraphAlignmentAlternative {
  string handle_id = 1;
  string handle_ref = 2;
  double score = 3;
  oneof header {
    PersonHeader person = 4;
    EventHeader event = 5;
    PlaceHeader place = 6;
  }
}

message PromoteGraphAlignmentRow {
  string subject_id = 1;
  string kind = 2;
  string target = 3; // handle, new, skip
  string handle_id = 4;
  string handle_ref = 5;
  double score = 6;
  string assessment = 7; // strong, weak, none
  repeated string reasons = 8;
  repeated PromoteGraphAlignmentComparison comparisons = 9;
  repeated PromoteGraphAlignmentAlternative alternatives = 10;
  bool conflict_with_fixed = 11;
  bool possible_duplicate = 12;
  oneof header {
    PersonHeader person = 13;
    EventHeader event = 14;
    PlaceHeader place = 15;
  }
  // Subject the walk reached this row from, when a neighbor seeded it.
  string via_neighbor_subject_id = 16;
  string via_bridge_type = 17;
  string via_role = 18;
  // With possible_duplicate: the other row on this layer this one may be the
  // same as (it took the handle this row wanted, or both are New and alike).
  string duplicate_of_subject_id = 19;
}

message ProposePromoteGraphAlignmentResponse {
  repeated PromoteGraphAlignmentRow rows = 1;
  // Audit revision the proposal was read at. Done sends it back as seen_revision.
  int64 revision = 2;
}

// ApplyPromoteGraphAlignment files one Done: claims, pins, and bridges, in
// one transaction. seen_revision is the proposal's revision; a later write
// fails the batch (promote.stale).
message ApplyPromoteGraphAlignmentRequest {
  string project_dir = 1;
  string user_id = 2;
  string source_id = 3;
  int64 seen_revision = 4;
  repeated ApplyPromoteGraphAlignmentRow rows = 5;
  repeated string skip_bridge_ids = 6;
}

message ApplyPromoteGraphAlignmentPair {
  string incoming_observation_id = 1;
  string member_observation_id = 2;
}

message ApplyPromoteGraphAlignmentRow {
  string subject_id = 1;
  string target = 2; // handle, new, skip
  string entity_id = 3;
  string confidence_grade_id = 4;
  string argument = 5;
  repeated ApplyPromoteGraphAlignmentPair pairs = 6;
}

message ApplyPromoteGraphAlignmentWritten {
  CanonicalEntity entity = 1;
  IdentityClaim claim = 2;
  int32 pins = 3;
}

message ApplyPromoteGraphAlignmentResponse {
  int64 revision = 1;
  repeated ApplyPromoteGraphAlignmentWritten written = 2;
}

