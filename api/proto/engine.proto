  repeated Observation observations = 3;
}

message UpdateCitationRequest {
  string project_dir = 1;
  string user_id = 2;
  string citation_id = 3;
  string locator_json = 4;
  string transcription = 5;
  string description = 6;
  bool transcription_uncertain = 7;
  string transcription_note = 8;
}
message UpdateCitationResponse { Citation citation = 1; }

message UpdateObservationRequest {
  string project_dir = 1;
  string user_id = 2;
  Observation observation = 3;
}
message UpdateObservationResponse { Observation observation = 1; }

message DeleteObservationRequest {
  string project_dir = 1;
  string user_id = 2;
  string observation_id = 3;
}
message DeleteObservationResponse {}

message GetPropertiesWorkspaceRequest { string project_dir = 1; }
message SubjectTypePropertiesGroup {
  string subject_type_id = 1;
  repeated SubjectTypeProperty properties = 2;
  SubjectTypePresentation presentation = 3;
}
message GetPropertiesWorkspaceResponse {
  repeated Property properties = 1;
  repeated SubjectType types = 2;
  repeated SubjectTypePropertiesGroup groups = 3;
}

message SourceGraphProgress {
  string source_id = 1;
  int32 subject_count = 2;
  int32 observation_count = 3;
  reserved 4;
  reserved "uncited_count";
}

message ListSourceGraphProgressRequest {
  string project_dir = 1;
}

message ListSourceGraphProgressResponse {
  repeated SourceGraphProgress rows = 1;
}

message GetSourceGraphProgressRequest {
  string project_dir = 1;
  string source_id = 2;
}

message GetSourceGraphProgressResponse {
  SourceGraphProgress progress = 1;
}

enum DeleteImpactGate {
  DELETE_IMPACT_GATE_UNSPECIFIED = 0;
  DELETE_IMPACT_GATE_OK = 1;
  DELETE_IMPACT_GATE_INBOUND = 2;
  DELETE_IMPACT_GATE_NOT_FOUND = 3;
  DELETE_IMPACT_GATE_EDGE_LOCKED = 4;
  DELETE_IMPACT_GATE_INFRA = 5;
  DELETE_IMPACT_GATE_ORIGIN_LOCKED = 6;
}

message GetDeleteImpactRequest {
  string project_dir = 1;
  string kind = 2; // source | artifact | citation | observation | …
  string id = 3;
}

message GetDeleteImpactResponse {
  bool allowed = 1;
  DeleteImpactGate gate = 2;
  repeated DeleteImpactGroup groups = 3;
  // Non-blocking: rows that go with the target on erase (a Subject's handle membership).
  repeated DeleteImpactGroup cascades = 4;
}

message DeleteImpactGroup {
  string via = 1;
  string kind = 2;
  int32 total = 3;
  repeated DeleteImpactListed listed = 4;
}

message DeleteImpactListed {
  string id = 1;
  string ref = 2;
  string title = 3;
  WorkspaceLocation location = 4;
}

// ErrorKind classifies a failure for client UX (tone, retry hints). Copy still
// comes from the client's L10n map keyed by Error.code.
enum ErrorKind {
  ERROR_KIND_UNSPECIFIED = 0;
  ERROR_KIND_USER = 1;
  ERROR_KIND_CONFLICT = 2;
  ERROR_KIND_NOT_FOUND = 3;
  ERROR_KIND_INTERNAL = 4;
}

// Error is the protobuf payload on provenencia_call status 1 (failure).
// Success payloads remain method-specific response messages.
message Error {
  string code = 1;              // e.g. "catalog.already_exists"
  ErrorKind kind = 2;
  repeated string params = 3;   // ordered args for L10n format strings
}
