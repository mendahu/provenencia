  string tint_token = 5;
  string chip_token = 6;
  string line_token = 7;
  string edge_from_token = 8;
  string edge_to_token = 9;
  string role = 10; // root | bridge | reification
  bool placeable = 11;
  int32 palette_sort = 12;
  bool requires_citation_at_create = 13;
  string label = 14; // English seed fallback
}

message ConnectRule {
  string from_type_key = 1;
  string to_type_key = 2;
  string bridge_type_key = 3;
  repeated string edge_property_keys = 4;
