syntax = "proto3";

package provenencia.engine.v1;

option go_package = "github.com/mendahu/provenencia/api/proto/engine";

// Method identifies the FFI operation. The C ABI is one call that takes this
// discriminant plus a protobuf payload; it is not a per-field getter surface.
enum Method {
  METHOD_UNSPECIFIED = 0;
  METHOD_PING = 1;
  METHOD_GET_VERSION = 2;
  METHOD_GET_INSTALL_IDENTITY = 3;
  METHOD_COMPLETE_ONBOARDING = 4;
  METHOD_REMOVE_INSTALL_IDENTITY = 5;
  METHOD_GET_ACTIVE_PROJECT = 6;
  METHOD_OPEN_PROJECT = 7;
  METHOD_REMOVE_ACTIVE_PROJECT = 8;
  METHOD_LIST_PROJECT_USERS = 9;
  METHOD_SIGN_OUT = 10;
  METHOD_GET_PROJECT_INFO = 11;
  METHOD_LIST_SOURCES = 12;
  METHOD_GET_SOURCE_WORKSPACE = 13;
  METHOD_CREATE_SOURCE = 14;
  METHOD_UPDATE_SOURCE = 15;
  METHOD_ADD_SOURCE_NOTE = 16;
  METHOD_UPDATE_SOURCE_NOTE = 17;
  METHOD_DELETE_SOURCE_NOTE = 18;
  METHOD_SET_SOURCE_METADATA = 19;
  METHOD_CLEAR_SOURCE_METADATA = 20;
  METHOD_CREATE_ARTIFACT = 21;
  METHOD_INGEST_ARTIFACT_FILE = 22;
  METHOD_LIST_SOURCE_TYPES = 23;
  METHOD_CREATE_SOURCE_TYPE = 24;
  METHOD_LIST_METADATA_FIELDS = 25;
  METHOD_CREATE_METADATA_FIELD = 26;
  METHOD_COUNT_FILES = 27;
  METHOD_UPDATE_METADATA_FIELD = 28;
  METHOD_DELETE_SOURCE_TYPE = 29;
  METHOD_DELETE_METADATA_FIELD = 30;
  METHOD_UPDATE_SOURCE_TYPE = 31;
  METHOD_LIST_TYPE_SUGGESTIONS = 32;
  METHOD_ASSIGN_TYPE_FIELD = 33;
  METHOD_REMOVE_TYPE_FIELD = 34;
  METHOD_GET_WORKSPACE_NAV_COUNTS = 35;
  METHOD_UPDATE_ARTIFACT = 36;
  METHOD_LIST_SOURCE_CREDIBILITY_GRADES = 37;
  METHOD_UPSERT_SOURCE_CREDIBILITY_ASSESSMENT = 38;
  METHOD_DISMISS_SOURCE_METADATA_SUGGESTION = 39;
  METHOD_REORDER_SOURCE_METADATA = 40;
  METHOD_ENSURE_FILE_THUMBNAIL = 41;
  METHOD_CLOSE_CATALOG_SESSION = 42;
  METHOD_SET_SOURCE_COVER = 43;
}

message PingRequest {
  string message = 1;
}

message PingResponse {
  string message = 1;
}

message GetVersionRequest {}

message GetVersionResponse {
  string version = 1;
}

message GetInstallIdentityRequest {
  string identity_dir = 1;
}

message GetInstallIdentityResponse {
  bool found = 1;
  string user_id = 2;
  string display_name = 3;
  string ref = 4;
}

message CompleteOnboardingRequest {
  string identity_dir = 1;
  string parent_dir = 2;
  string display_name = 3;
  string family_name = 4;
}

message CompleteOnboardingResponse {
  string project_dir = 1;
  string user_id = 2;
  string display_name = 3;
  string ref = 4;
  ProjectInfo project = 5;
}

message RemoveInstallIdentityRequest {
  string identity_dir = 1;
}

message RemoveInstallIdentityResponse {}

message GetActiveProjectRequest {
  string identity_dir = 1;
}

message GetActiveProjectResponse {
  bool found = 1;
  string project_dir = 2;
}

message OpenProjectRequest {
  string identity_dir = 1;
  string project_dir = 2;
  string display_name = 3;
  string adopt_user_id = 4;
}

message OpenProjectResponse {
  string project_dir = 1;
  string user_id = 2;
  string display_name = 3;
  string ref = 4;
  ProjectInfo project = 5;
}

message RemoveActiveProjectRequest {
  string identity_dir = 1;
}

message RemoveActiveProjectResponse {}

message ListProjectUsersRequest {
  string project_dir = 1;
}

message ProjectUser {
  string user_id = 1;
  string display_name = 2;
  string ref = 3;
}

message ListProjectUsersResponse {
  repeated ProjectUser users = 1;
}

message SignOutRequest {
  string identity_dir = 1;
}

message SignOutResponse {}

message GetProjectInfoRequest {
  string project_dir = 1;
}

message ProjectInfo {
  string label = 1;
  string folder_name = 2;
  string created_at = 3;
  string updated_at = 4;
  string updated_by_user_id = 5;
  string updated_by_display_name = 6;
  string updated_by_ref = 7;
}

message GetProjectInfoResponse {
  ProjectInfo project = 1;
}

// --- Source catalog (S2-13) ---

message Source {
  string id = 1;
  string ref = 2;
  string source_type_id = 3;
  string title = 4;
  string description = 5;
  // Thumbnail JPEG under objects/… for list cells (empty = no raster).
  string thumbnail_rel_path = 6;
  // When thumbnail_rel_path is empty but a File exists under some Artifact,
  // MIME of the cover-candidate File for client file-type glyph fallback.
  string thumbnail_media_type = 7;
  string thumbnail_original_filename = 8;
  // Cover preference: "artifact" (primary_artifact_id) or "type_icon".
  string cover_mode = 9;
  // Set when cover_mode is artifact; empty for type_icon.
  string primary_artifact_id = 10;
}

message SourceNote {
  string id = 1;
  string source_id = 2;
  string body = 3;
  // Create attribution from audit (not domain columns on source_notes).
  string author_display_name = 4;
  string created_at = 5; // RFC3339 UTC
}

message SourceFileRef {
  string id = 1;
  string rel_path = 2;
  string original_filename = 3;
  string media_type = 4;
  int64 byte_size = 5;
}

message Artifact {
  string id = 1;
  string ref = 2;
  string source_id = 3;
  string file_id = 4; // empty when fileless
  string description = 5;
  SourceFileRef file = 6; // set when file_id present
  string label = 7; // required list headline
  // Thumbnail JPEG under objects/… (empty when fileless / non-image / skipped).
  string thumbnail_rel_path = 8;
}

// SourceCredibilityGrade is one source_credibility_grades vocabulary row.
message SourceCredibilityGrade {
  string id = 1;
  string key = 2;
  string origin = 3;
  string label = 4;
  int32 sort_order = 5;
}

// SourceCredibilityAssessment is the working Interpretation assessment for a Source.
message SourceCredibilityAssessment {
  string id = 1;
  string source_id = 2;
  string grade_id = 3;
  string grade_key = 4;
  string grade_label = 5;
  string argument = 6;
}

message SourceType {
  string id = 1;
  string key = 2;
  string origin = 3;
  string label = 4;
  string description = 5;
  // How many sources classify as this type. Deleting is only allowed at 0
  // (see sourcetypes.ErrInUse); the client uses the count to disable its
  // delete affordance and say what is holding the type.
  int32 used_by = 6;
  // How many metadata fields this type suggests — the list's third column,
  // so browsing does not have to fetch every type's join rows.
  int32 suggested_field_count = 7;
  // Closed design-system type_* key for evidence representation.
  string icon_key = 8;
}

// TypeSuggestion is one source_type_metadata_fields join row: a field this
// type suggests, in its stored order. Suggestions are not a schema — a
// source of the type may leave any of them blank.
message TypeSuggestion {
  MetadataField field = 1;
  int32 sort_order = 2;
}

message MetadataField {
  string id = 1;
  string key = 2;
  string origin = 3;
  string label = 4;
  string data_type = 5; // text | date
  string description = 6;
  // How many source_metadata rows reference this field. Deleting is only
  // allowed at 0 (see sourcefields.ErrInUse); the client uses the count to
  // disable its delete affordance and say what is holding the field.
  int32 used_by = 7;
}

message MetadataWorkspaceEntry {
  MetadataField field = 1;
  string value_text = 2;
  string date_value_id = 3;
  bool has_value = 4;
  bool suggested = 5;
  int32 sort_order = 6;
  reserved 7;
  reserved "date_summary";
  // Full structured components when date_value_id is set, so the client can
  // rebuild the date editor without a session cache (unset otherwise).
  DateValueInput date = 8;
}

// DateValueInput maps to datevalues.Insert (kind point|range; see docs/structured-date-model.md).
message DateValueInput {
  string kind = 1;
  string qualifier = 2;
  string calendar = 3;
  optional int32 start_year = 4;
  optional int32 start_month = 5;
  optional int32 start_day = 6;
  optional int32 start_hour = 7;
  optional int32 start_minute = 8;
  optional int32 start_second = 9;
  optional int32 start_millisecond = 10;
  string start_tz = 11;
  optional int32 end_year = 12;
  optional int32 end_month = 13;
  optional int32 end_day = 14;
  optional int32 end_hour = 15;
  optional int32 end_minute = 16;
  optional int32 end_second = 17;
  optional int32 end_millisecond = 18;
  string end_tz = 19;
  string phrase = 20;
}

message ListSourcesRequest {
  string project_dir = 1;
}

message ListSourcesResponse {
  repeated Source sources = 1;
}

message GetSourceWorkspaceRequest {
  string project_dir = 1;
  string source_id = 2;
}

message GetSourceWorkspaceResponse {
  Source source = 1;
  repeated SourceNote notes = 2;
  repeated MetadataWorkspaceEntry metadata = 3;
  repeated Artifact artifacts = 4;
  // Omitted when no assessment row (UI may display Standard without a row).
  SourceCredibilityAssessment credibility = 5;
  // Page vocabulary folded into the same exclusive catalog open so the
  // Source page loads with one RPC (types picker, credibility chips, and
  // the Add-metadata field list).
  repeated SourceType types = 6;
  repeated SourceCredibilityGrade grades = 7;
  repeated MetadataField fields = 8;
}

message CreateSourceRequest {
  string project_dir = 1;
  string user_id = 2;
  string source_type_id = 3;
  string title = 4; // required (non-empty after trim)
  string description = 5;
}

message CreateSourceResponse {
  Source source = 1;
}

message UpdateSourceRequest {
  string project_dir = 1;
  string user_id = 2;
  string source_id = 3;
  string source_type_id = 4;
  string title = 5;
  string description = 6;
}

message UpdateSourceResponse {
  Source source = 1;
}

message SetSourceCoverRequest {
  string project_dir = 1;
  string user_id = 2;
  string source_id = 3;
  // "artifact" or "type_icon".
  string cover_mode = 4;
  // Required when cover_mode is artifact; ignored for type_icon.
  string primary_artifact_id = 5;
}

message SetSourceCoverResponse {
  Source source = 1;
}

message AddSourceNoteRequest {
  string project_dir = 1;
  string user_id = 2;
  string source_id = 3;
  string body = 4;
}

message AddSourceNoteResponse {
  SourceNote note = 1;
}

message UpdateSourceNoteRequest {
  string project_dir = 1;
  string user_id = 2;
  string note_id = 3;
  string body = 4;
}

message UpdateSourceNoteResponse {
  SourceNote note = 1;
}

message DeleteSourceNoteRequest {
  string project_dir = 1;
  string user_id = 2;
  string note_id = 3;
}

message DeleteSourceNoteResponse {}

message SetSourceMetadataRequest {
  string project_dir = 1;
  string user_id = 2;
  string source_id = 3;
  string field_id = 4;
  string value_text = 5;
  DateValueInput date = 6; // optional; when kind set, inserts a DateValue
}

// SetSourceMetadataResponse returns the refreshed workspace entry so the
// client can patch its list without refetching (structured date included).
message SetSourceMetadataResponse {
  MetadataWorkspaceEntry entry = 1;
}

message ClearSourceMetadataRequest {
  string project_dir = 1;
  string user_id = 2;
  string source_id = 3;
  string field_id = 4;
}

message ClearSourceMetadataResponse {}

// DismissSourceMetadataSuggestionRequest permanently hides an unfilled type
// suggestion for this Source (source_metadata_layout.dismissed).
message DismissSourceMetadataSuggestionRequest {
  string project_dir = 1;
  string user_id = 2;
  string source_id = 3;
  string field_id = 4;
}

message DismissSourceMetadataSuggestionResponse {
  repeated MetadataWorkspaceEntry metadata = 1;
}

// ReorderSourceMetadataRequest sets display order for the Source's visible
// metadata rows (valued + suggestions) via source_metadata_layout.sort_order.
message ReorderSourceMetadataRequest {
  string project_dir = 1;
  string user_id = 2;
  string source_id = 3;
  repeated string field_ids = 4;
}

message ReorderSourceMetadataResponse {
  repeated MetadataWorkspaceEntry metadata = 1;
}

message CreateArtifactRequest {
  string project_dir = 1;
  string user_id = 2;
  string source_id = 3;
  string file_id = 4; // empty = fileless
  string description = 5;
  string label = 6; // required
}

message CreateArtifactResponse {
  Artifact artifact = 1;
}

// UpdateArtifactRequest patches label and/or description only.
// File attach stays IngestArtifactFile (first-attach only).
message UpdateArtifactRequest {
  string project_dir = 1;
  string user_id = 2;
  string artifact_id = 3;
  string label = 4;
  string description = 5;
}

message UpdateArtifactResponse {
  Artifact artifact = 1;
}

message IngestArtifactFileRequest {
  string project_dir = 1;
  string user_id = 2;
  string artifact_id = 3;
  string path = 4; // absolute path on disk; bytes not in protobuf
}

message IngestArtifactFileResponse {
  Artifact artifact = 1;
  SourceFileRef file = 2;
  bool reused = 3;
}

message ListSourceCredibilityGradesRequest {
  string project_dir = 1;
}

message ListSourceCredibilityGradesResponse {
  repeated SourceCredibilityGrade grades = 1;
}

message UpsertSourceCredibilityAssessmentRequest {
  string project_dir = 1;
  string user_id = 2;
  string source_id = 3;
  string grade_id = 4; // preferred when set
  string grade_key = 5; // with grade_origin when grade_id empty
  string grade_origin = 6;
  string argument = 7;
}

message UpsertSourceCredibilityAssessmentResponse {
  SourceCredibilityAssessment assessment = 1;
}

message ListSourceTypesRequest {
  string project_dir = 1;
}

message ListSourceTypesResponse {
  repeated SourceType types = 1;
}

message CreateSourceTypeRequest {
  string project_dir = 1;
  string user_id = 2;
  reserved 3; // key: minted server-side from label (core/slug.Kebab), never client-supplied
  reserved "key";
  string label = 4;
  string description = 5;
  string icon_key = 6;
}

message CreateSourceTypeResponse {
  SourceType type = 1;
}

message ListMetadataFieldsRequest {
  string project_dir = 1;
}

message ListMetadataFieldsResponse {
  repeated MetadataField fields = 1;
}

message CreateMetadataFieldRequest {
  string project_dir = 1;
  string user_id = 2;
  reserved 3; // key: minted server-side from label (core/slug.Kebab), never client-supplied
  reserved "key";
  string label = 4;
  string data_type = 5;
  string description = 6;
}

message CreateMetadataFieldResponse {
  MetadataField field = 1;
}

message UpdateMetadataFieldRequest {
  string project_dir = 1;
  string user_id = 2;
  string field_id = 3;
  string label = 4;
  string data_type = 5;
  string description = 6;
}

message UpdateMetadataFieldResponse {
  MetadataField field = 1;
}

message UpdateSourceTypeRequest {
  string project_dir = 1;
  string user_id = 2;
  string type_id = 3;
  string label = 4;
  string description = 5;
  string icon_key = 6;
}

message UpdateSourceTypeResponse {
  SourceType type = 1;
}

message ListTypeSuggestionsRequest {
  string project_dir = 1;
  string type_id = 2;
}

message ListTypeSuggestionsResponse {
  repeated TypeSuggestion suggestions = 1;
}

// AssignTypeField attaches an existing metadata field to a type at the end
// of its order. Assigning a field the type already suggests is a no-op, not
// an error. Both replies carry the type's whole suggestion list back so the
// client never has to re-derive sort_order.
message AssignTypeFieldRequest {
  string project_dir = 1;
  string user_id = 2;
  string type_id = 3;
  string field_id = 4;
}

message AssignTypeFieldResponse {
  repeated TypeSuggestion suggestions = 1;
}

// RemoveTypeField detaches a field from a type. It deletes only the join —
// the field stays in the vocabulary and sources already carrying a value
// for it keep that value.
message RemoveTypeFieldRequest {
  string project_dir = 1;
  string user_id = 2;
  string type_id = 3;
  string field_id = 4;
}

message RemoveTypeFieldResponse {
  repeated TypeSuggestion suggestions = 1;
}

message DeleteSourceTypeRequest {
  string project_dir = 1;
  string user_id = 2;
  string type_id = 3;
}

message DeleteSourceTypeResponse {}

message DeleteMetadataFieldRequest {
  string project_dir = 1;
  string user_id = 2;
  string field_id = 3;
}

message DeleteMetadataFieldResponse {}

// CountFiles reports the total number of content-addressed files rows in
// the project — distinct files, not the (larger, per-source) artifact
// count. No project-wide artifact listing exists yet (S2-17).
message CountFilesRequest {
  string project_dir = 1;
}

message CountFilesResponse {
  int32 count = 1;
}

// VocabularyOriginCounts is the sidebar / vocabulary-header split for a
// catalog vocabulary (source_types or source_metadata_fields). total is
// always seeded + user + plugin.
message VocabularyOriginCounts {
  int32 total = 1;
  int32 seeded = 2;
  int32 user = 3;
  int32 plugin = 4;
}

// GetWorkspaceNavCounts opens the project catalog once and returns COUNT(*)
// badges for every workspace sidebar destination, including origin splits
// for vocabulary rows. Prefer this over N serial list/count RPCs on appear.
message GetWorkspaceNavCountsRequest {
  string project_dir = 1;
}

message GetWorkspaceNavCountsResponse {
  int32 sources = 1;
  VocabularyOriginCounts source_types = 2;
  VocabularyOriginCounts source_fields = 3;
  int32 files = 4;
}

// EnsureFileThumbnail lazily creates (or returns) the default thumbnail
// derivative for a File that is the primary File of some Artifact.
message EnsureFileThumbnailRequest {
  string project_dir = 1;
  string file_id = 2;
}

message EnsureFileThumbnailResponse {
  string rel_path = 1; // objects/… path; empty when skipped
  bool skipped = 2;    // non-image, unprocessable, or no derivative
}

message CloseCatalogSessionRequest {
  string project_dir = 1; // required; releases the held session for this project
}

message CloseCatalogSessionResponse {}

// ErrorKind classifies a failure for client UX (tone, retry hints). Copy still
// comes from the client's L10n map keyed by Error.code.
enum ErrorKind {
  ERROR_KIND_UNSPECIFIED = 0;
  ERROR_KIND_USER = 1;
  ERROR_KIND_CONFLICT = 2;
  ERROR_KIND_NOT_FOUND = 3;
  ERROR_KIND_INTERNAL = 4;
}

// Error is the protobuf payload on provenencia_call status 1 (failure).
// Success payloads remain method-specific response messages.
message Error {
  string code = 1;              // e.g. "catalog.already_exists"
  ErrorKind kind = 2;
  repeated string params = 3;   // ordered args for L10n format strings
}
