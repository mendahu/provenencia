message ClearSourceMetadataRequest {
  string project_dir = 1;
  string user_id = 2;
  string source_id = 3;
  string field_id = 4;
}

message ClearSourceMetadataResponse {}

// DismissSourceMetadataSuggestionRequest permanently hides an unfilled type
// suggestion for this Source (source_metadata_layout.dismissed).
message DismissSourceMetadataSuggestionRequest {
  string project_dir = 1;
  string user_id = 2;
  string source_id = 3;
  string field_id = 4;
}

message DismissSourceMetadataSuggestionResponse {
  repeated MetadataWorkspaceEntry metadata = 1;
}

// ReorderSourceMetadataRequest sets display order for the Source's visible
// metadata rows (valued + suggestions) via source_metadata_layout.sort_order.
message ReorderSourceMetadataRequest {
  string project_dir = 1;
  string user_id = 2;
  string source_id = 3;
  repeated string field_ids = 4;
}

message ReorderSourceMetadataResponse {
  repeated MetadataWorkspaceEntry metadata = 1;
}

message CreateArtifactRequest {
  string project_dir = 1;
  string user_id = 2;
  string source_id = 3;
  string file_id = 4; // empty = fileless
  string description = 5;
  string label = 6; // required
}

message CreateArtifactResponse {
  Artifact artifact = 1;
}

// UpdateArtifactRequest patches label and/or description only.
// File attach stays IngestArtifactFile (first-attach only).
message UpdateArtifactRequest {
  string project_dir = 1;
  string user_id = 2;
  string artifact_id = 3;
  string label = 4;
  string description = 5;
}

message UpdateArtifactResponse {
  Artifact artifact = 1;
}

message IngestArtifactFileRequest {
  string project_dir = 1;
  string user_id = 2;
  string artifact_id = 3;
  string path = 4; // absolute path on disk; bytes not in protobuf
}

message IngestArtifactFileResponse {
  Artifact artifact = 1;
  SourceFileRef file = 2;
  bool reused = 3;
}

message ListSourceCredibilityGradesRequest {
  string project_dir = 1;
}

message ListSourceCredibilityGradesResponse {
  repeated SourceCredibilityGrade grades = 1;
}

message UpsertSourceCredibilityAssessmentRequest {
  string project_dir = 1;
  string user_id = 2;
  string source_id = 3;
  string grade_id = 4; // preferred when set
  string grade_key = 5; // with grade_origin when grade_id empty
  string grade_origin = 6;
  string argument = 7;
}

message UpsertSourceCredibilityAssessmentResponse {
  SourceCredibilityAssessment assessment = 1;
}

message ListSourceTypesRequest {
  string project_dir = 1;
}

message ListSourceTypesResponse {
  repeated SourceType types = 1;
}

message CreateSourceTypeRequest {
  string project_dir = 1;
  string user_id = 2;
  reserved 3; // key: minted server-side from label (core/slug.Kebab), never client-supplied
  reserved "key";
  string label = 4;
  string description = 5;
  string icon_key = 6;
}

message CreateSourceTypeResponse {
  SourceType type = 1;
}

message ListMetadataFieldsRequest {
  string project_dir = 1;
}

message ListMetadataFieldsResponse {
  repeated MetadataField fields = 1;
}

message CreateMetadataFieldRequest {
  string project_dir = 1;
  string user_id = 2;
  reserved 3; // key: minted server-side from label (core/slug.Kebab), never client-supplied
  reserved "key";
  string label = 4;
  string data_type = 5;
  string description = 6;
}

message CreateMetadataFieldResponse {
  MetadataField field = 1;
}

message UpdateMetadataFieldRequest {
  string project_dir = 1;
  string user_id = 2;
  string field_id = 3;
  string label = 4;
  string data_type = 5;
  string description = 6;
}

message UpdateMetadataFieldResponse {
  MetadataField field = 1;
}

message UpdateSourceTypeRequest {
  string project_dir = 1;
  string user_id = 2;
  string type_id = 3;
  string label = 4;
  string description = 5;
  string icon_key = 6;
}

message UpdateSourceTypeResponse {
  SourceType type = 1;
}

message ListTypeSuggestionsRequest {
  string project_dir = 1;
  string type_id = 2;
}

message ListTypeSuggestionsResponse {
  repeated TypeSuggestion suggestions = 1;
}

// AssignTypeField attaches an existing metadata field to a type at the end
// of its order. Assigning a field the type already suggests is a no-op, not
// an error. Both replies carry the type's whole suggestion list back so the
// client never has to re-derive sort_order.
message AssignTypeFieldRequest {
  string project_dir = 1;
  string user_id = 2;
  string type_id = 3;
  string field_id = 4;
}

message AssignTypeFieldResponse {
  repeated TypeSuggestion suggestions = 1;
}

// RemoveTypeField detaches a field from a type. It deletes only the join —
// the field stays in the vocabulary and sources already carrying a value
// for it keep that value.
message RemoveTypeFieldRequest {
  string project_dir = 1;
  string user_id = 2;
  string type_id = 3;
  string field_id = 4;
}

message RemoveTypeFieldResponse {
  repeated TypeSuggestion suggestions = 1;
}

message DeleteSourceTypeRequest {
  string project_dir = 1;
  string user_id = 2;
  string type_id = 3;
}

message DeleteSourceTypeResponse {}

message DeleteMetadataFieldRequest {
  string project_dir = 1;
  string user_id = 2;
  string field_id = 3;
}

message DeleteMetadataFieldResponse {}

// VocabularyOriginCounts is the sidebar / vocabulary-header split for a
// catalog vocabulary (source_types or source_metadata_fields). total is
// always seeded + user + plugin.
message VocabularyOriginCounts {
  int32 total = 1;
  int32 seeded = 2;
  int32 user = 3;
  int32 plugin = 4;
}

// GetWorkspaceNavCounts opens the project catalog once and returns COUNT(*)
// badges for every workspace sidebar destination, including origin splits
// for vocabulary rows. Prefer this over N serial list/count RPCs on appear.
message GetWorkspaceNavCountsRequest {
  string project_dir = 1;
}

message GetWorkspaceNavCountsResponse {
  int32 sources = 1;
  VocabularyOriginCounts source_types = 2;
  VocabularyOriginCounts source_fields = 3;
  reserved 4;
  reserved "files";
}

// EnsureFileThumbnail lazily creates (or returns) the default thumbnail
// derivative for a File that is the primary File of some Artifact.
message EnsureFileThumbnailRequest {
  string project_dir = 1;
  string file_id = 2;
}

message EnsureFileThumbnailResponse {
  string rel_path = 1; // objects/… path; empty when skipped
  bool skipped = 2;    // non-image, unprocessable, or no derivative
}

message CloseCatalogSessionRequest {
  string project_dir = 1; // required; releases the held session for this project
}

message CloseCatalogSessionResponse {}

// WorkspaceLocation is the navigable place payload shared by search hits and
// (later) omnibar go(to:). Aligns with macOS WorkspaceLocation / WorkspaceSection.
message WorkspaceLocation {
  string section = 1;    // sources | source-types | source-fields | files
  string source_id = 2;
  string field_id = 3;
  string type_id = 4;
  string ref = 5;        // denormalized jump-menu cache
  string title = 6;      // denormalized jump-menu cache
}

// SearchCatalog finds navigable catalog roots for the omnibar (S3-07+).
message SearchCatalogRequest {
  string project_dir = 1;
  string query = 2;
  WorkspaceLocation location = 3; // current place; at least section for context boosts
}

message SearchHit {
  string kind = 1;         // source | source_type | source_field
  string id = 2;
  string ref = 3;
  string title = 4;
  string subtitle = 5;
  // Stable match field code (title|ref|label|key|notes|metadata|filename|description|fuzzy).
  // Not user-facing copy — Mac localizes via L10n.
  string match_reason = 6;
  WorkspaceLocation location = 7;
  // Display stubs for omnibar lead chrome (avoid a second full-list fetch).
  string thumbnail_rel_path = 8; // Source cover raster when already derived; else empty
  string icon_key = 9;           // Source type icon, or type hit icon; empty for fields
  // Optional raw snippet for body/rollup matches (notes/metadata/filename). No English prefix.
  string match_snippet = 10;
}

message SearchCatalogResponse {
  repeated SearchHit hits = 1;
}

// SubjectType is one subject_types vocabulary row (shared with Conclusion).
message SubjectType {
  string id = 1;
  string key = 2;
  string origin = 3;
  string label = 4;
  string description = 5;
  string ref_prefix = 6;
  string candidate_ref_prefix = 7;
}

// Subject is one Interpretation subject (candidate) row.
message Subject {
  string id = 1;
  string ref = 2;
  string source_id = 3;
  string subject_type_id = 4;
  string label = 5;
  string description = 6;
}

// SubjectPosition is unaudited graph layout for one subject.
message SubjectPosition {
  string subject_id = 1;
  int64 grid_x = 2;
  int64 grid_y = 3;
}

message ListSubjectTypesRequest {
  string project_dir = 1;
}

message ListSubjectTypesResponse {
  repeated SubjectType types = 1;
}

message CreateSubjectRequest {
  string project_dir = 1;
  string user_id = 2;
  string source_id = 3;
  string subject_type_id = 4;
  string label = 5;
  string description = 6;
}

message CreateSubjectResponse {
  Subject subject = 1;
}

message UpdateSubjectRequest {
  string project_dir = 1;
  string user_id = 2;
  string subject_id = 3;
  string label = 4;
  string description = 5;
}

message UpdateSubjectResponse {
  Subject subject = 1;
}

message DeleteSubjectRequest {
  string project_dir = 1;
  string user_id = 2;
  string subject_id = 3;
}

message DeleteSubjectResponse {}

message ListSubjectsRequest {
  string project_dir = 1;
  string source_id = 2;
}

message ListSubjectsResponse {
  repeated Subject subjects = 1;
}

message SetSubjectPositionRequest {
  string project_dir = 1;
  string subject_id = 2;
  int64 grid_x = 3;
  int64 grid_y = 4;
}

message SetSubjectPositionResponse {
  SubjectPosition position = 1;
}

message ClearSubjectPositionRequest {
  string project_dir = 1;
  string subject_id = 2;
}

message ClearSubjectPositionResponse {}

message ListSubjectPositionsRequest {
  string project_dir = 1;
  string source_id = 2;
}

message ListSubjectPositionsResponse {
  repeated SubjectPosition positions = 1;
}

// Property is one properties vocabulary row (Observation predicate).
message Property {
  string id = 1;
  string key = 2;
  string origin = 3;
  string label = 4;
  string description = 5;
  string value_type = 6; // text | integer | date | name | subject | term
  int32 used_by = 7; // subject_type_fields references; delete only at 0
}

// PropertyTerm is one categorical value for a term-typed Property.
message PropertyTerm {
  string id = 1;
  string property_id = 2;
  string key = 3;
  string origin = 4;
  string label = 5;
  string description = 6;
}

message SubjectTypeField {
  Property property = 1;
  int32 sort_order = 2;
  bool locked = 3; // registry-locked; client must not offer remove
}

message SubjectTypePresentation {
  string type_key = 1;
  string l10n_key = 2;
  string icon_symbol = 3;
  string ink_token = 4;
  string tint_token = 5;
  string chip_token = 6;
  string line_token = 7;
  string edge_from_token = 8;
  string edge_to_token = 9;
  string role = 10; // root | bridge | reification
  bool placeable = 11;
  int32 palette_sort = 12;
  bool requires_citation_at_create = 13;
  string label = 14; // English seed fallback
}

message ConnectRule {
  string from_type_key = 1;
  string to_type_key = 2;
  string bridge_type_key = 3;
  repeated string edge_property_keys = 4;
  string disambiguation = 5; // none | role | relationship_type
  bool refuse = 6;
}

message ListPropertiesRequest {
  string project_dir = 1;
}

message ListPropertiesResponse {
  repeated Property properties = 1;
}

message CreatePropertyRequest {
  string project_dir = 1;
  string user_id = 2;
  reserved 3;
  reserved "key";
  string label = 4;
  string value_type = 5;
  string description = 6;
}

message CreatePropertyResponse {
  Property property = 1;
}

