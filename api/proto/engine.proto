// Property is one properties vocabulary row (Observation predicate).
message Property {
  string id = 1;
  string key = 2;
  string origin = 3;
  string label = 4;
  string description = 5;
  string value_type = 6; // text | integer | date | name | subject | term
  int32 used_by = 7; // subject_type_properties references; delete only at 0
  string cardinality = 8; // single | multiple
}

// PropertyTerm is one categorical value for a term-typed Property.
message PropertyTerm {
  string id = 1;
  string property_id = 2;
  string key = 3;
  string origin = 4;
  string label = 5;
  string description = 6;
}

